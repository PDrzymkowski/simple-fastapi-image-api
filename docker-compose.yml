services:
    api:
        build: .
        restart: on-failure
        ports:
            - "8000:8000"
        env_file: .env
        depends_on:
            postgres:
                condition: service_healthy

    postgres:
        image: postgres:16
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: simpleimageapi
        ports:
            - "5432:5432"
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 5s
            timeout: 5s
            retries: 5
